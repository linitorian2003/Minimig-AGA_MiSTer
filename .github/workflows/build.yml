name: Build Minimig Core

on:
  push:
    branches:
      - secondary-sd-support
      - MiSTer
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull Quartus 17.1 Docker image
        run: |
          docker pull raetro/quartus:17.1

      - name: Compile Minimig core
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            --entrypoint "" \
            raetro/quartus:17.1 \
            /bin/bash -c "find /opt -name 'quartus_sh' 2>/dev/null | head -5 && find /home -name 'quartus_sh' 2>/dev/null | head -5 && find /usr -name 'quartus_sh' 2>/dev/null | head -5 && export PATH=\$(dirname \$(find / -name 'quartus_sh' 2>/dev/null | head -1)):\$PATH && quartus_sh --flow compile Minimig.qpf"

      - name: List output files
        if: always()
        run: |
          echo "=== Output files ==="
          ls -la output_files/ || echo "No output_files directory"
          find . -name "*.rbf" -o -name "*.sof" 2>/dev/null || echo "No RBF/SOF found"

      - name: Upload RBF as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Minimig_SD2_${{ github.sha }}
          path: |
            output_files/*.rbf
            output_files/*.sof
          retention-days: 30
